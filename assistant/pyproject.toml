[project]
name = "assistant"
version = "0.1.0"
description = "Chat assistant that helps Ledgerly users find events and prepare ticket orders"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.1",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
assistant = "assistant.app:main"
assistant-mcp = "assistant.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
