spring:
  application:
    name: notification-consumer
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/notification
    username: ledgerly
    password: ledgerly
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      # A span for every record handled, continuing the trace in the record's headers.
      observation-enabled: true
    consumer:
      group-id: notification-consumer
      auto-offset-reset: earliest

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      # Share of requests that are traced. The observability profile below traces all of them.
      probability: 0.1
  otlp:
    metrics:
      export:
        # Nothing is exported unless the observability profile is on: there may be no collector to send to.
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        # Buckets, so percentiles can be computed over any time range and summed across instances.
        http.server.requests: true

jdbc:
  # One span per SQL statement. No spans for connections and result sets, and never the parameter values.
  includes: query

---
# Sends metrics and traces to an OpenTelemetry collector. Start one with:
#   docker compose --profile observability up -d
# then run the application with SPRING_PROFILES_ACTIVE=observability.
spring:
  config:
    activate:
      on-profile: observability

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: true
        url: http://localhost:4318/v1/metrics
        step: 10s
