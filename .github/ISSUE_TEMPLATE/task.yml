name: Task
description: Một việc cần làm
title: ""
body:
  - type: textarea
    id: description
    attributes:
      label: Mô tả
      description: Làm gì và vì sao.
    validations:
      required: true
  - type: input
    id: output
    attributes:
      label: Đầu ra
      description: File, test hoặc link sẽ có khi xong
      placeholder: ConcurrentTransferIT
  - type: input
    id: estimate
    attributes:
      label: Ước lượng (giờ)
      placeholder: "2"
  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done
      options:
        - label: Code + test, CI xanh
        - label: Không còn `TODO` nào chưa gắn issue
        - label: README đã cập nhật nếu thay đổi ảnh hưởng tới nó
        - label: Giải thích được **từng dòng**
