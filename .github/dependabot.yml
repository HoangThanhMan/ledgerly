# Cập nhật dependency hằng tuần (W02-09). Bản minor/patch gộp thành một PR để đỡ ồn.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    labels: ["type:build"]
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    labels: ["type:ci"]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
