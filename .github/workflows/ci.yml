name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Caches Gradle dependencies, the wrapper and the build cache. Only main writes the cache, other branches read it.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build (Spotless, Error Prone, NullAway, unit test, integration test, JaCoCo)
        run: ./gradlew build

      - name: Coverage summary
        if: always()
        run: python3 scripts/ci/coverage-summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: "**/build/reports/jacoco/"
          retention-days: 7
