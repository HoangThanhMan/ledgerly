<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%222%22 y=%228%22 width=%2228%22 height=%2216%22 rx=%223%22 fill=%22%235b2a86%22/%3E%3Ccircle cx=%2222%22 cy=%228%22 r=%223%22 fill=%22%23f6eef2%22/%3E%3Ccircle cx=%2222%22 cy=%2224%22 r=%223%22 fill=%22%23f6eef2%22/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/app.css">
    <title>TicketBox</title>
  </head>
  <body>
    <header class="topbar"></header>
    <main>
      <section class="hero">
        <h1>Vé sự kiện, trả bằng ví của bạn.</h1>
        <p class="lead">
          Nạp tiền vào ví một lần, rồi mua vé trong vài giây. Số vé còn lại của mỗi hạng cập nhật ngay khi có người
          mua, không cần tải lại trang.
        </p>
        <div class="actions">
          <a class="button" href="events.html">Xem sự kiện</a>
          <a class="button quiet" href="register.html" data-signed-out>Tạo tài khoản</a>
        </div>
      </section>
    </main>
    <script type="module">
      import { renderTopbar } from "./js/auth.js";
      import { token } from "./js/api.js";

      renderTopbar();
      if (token()) {
        document.querySelector("[data-signed-out]").hidden = true;
      }
    </script>
  </body>
</html>
