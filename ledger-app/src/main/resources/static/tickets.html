<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      // Theme and language before anything is drawn, so the page does not flash. ?theme= and ?lang= are for screenshots.
      (() => {
        const root = document.documentElement;
        const asked = new URLSearchParams(location.search);
        try {
          const dark = matchMedia("(prefers-color-scheme: dark)").matches;
          root.dataset.theme = asked.get("theme") || localStorage.getItem("theme") || (dark ? "dark" : "light");
          root.lang = (asked.get("lang") || localStorage.getItem("lang")) === "en" ? "en" : "vi";
        } catch {
          root.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%222%22 y=%228%22 width=%2228%22 height=%2216%22 rx=%223%22 fill=%22%235b2a86%22/%3E%3Ccircle cx=%2222%22 cy=%228%22 r=%223%22 fill=%22%23f6eef2%22/%3E%3Ccircle cx=%2222%22 cy=%2224%22 r=%223%22 fill=%22%23f6eef2%22/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/app.css">
    <title>Vé của tôi – Ledgerly</title>
  </head>
  <body>
    <header class="topbar"></header>
    <main>
      <div class="page-head">
        <h1 data-i18n="tickets.title"></h1>
      </div>
      <div role="alert" class="notice" data-message></div>
      <div class="empty" data-empty hidden>
        <p class="lead" data-i18n="tickets.empty"></p>
        <a class="button" href="events.html" data-i18n="tickets.browse"></a>
      </div>
      <ul class="orders" data-orders hidden></ul>
      <nav class="pager" data-pager data-i18n-aria-label="events.pager" hidden>
        <a class="button quiet" data-previous data-i18n="events.previous"></a>
        <span class="muted" data-where></span>
        <a class="button quiet" data-next data-i18n="events.next"></a>
      </nav>
    </main>
    <script type="module">
      import { renderTopbar } from "./js/auth.js";
      import { t, translatePage } from "./js/i18n.js";
      import { showTickets } from "./js/tickets.js";

      document.title = t("title.tickets");
      translatePage();
      renderTopbar();
      showTickets(document.querySelector("main"));
    </script>
  </body>
</html>
