<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      // Theme and language before anything is drawn, so the page does not flash. ?theme= and ?lang= are for screenshots.
      (() => {
        const root = document.documentElement;
        const asked = new URLSearchParams(location.search);
        try {
          const dark = matchMedia("(prefers-color-scheme: dark)").matches;
          root.dataset.theme = asked.get("theme") || localStorage.getItem("theme") || (dark ? "dark" : "light");
          root.lang = (asked.get("lang") || localStorage.getItem("lang")) === "en" ? "en" : "vi";
        } catch {
          root.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%222%22 y=%228%22 width=%2228%22 height=%2216%22 rx=%223%22 fill=%22%235b2a86%22/%3E%3Ccircle cx=%2222%22 cy=%228%22 r=%223%22 fill=%22%23f6eef2%22/%3E%3Ccircle cx=%2222%22 cy=%2224%22 r=%223%22 fill=%22%23f6eef2%22/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/app.css">
    <title>Trợ lý – Ledgerly</title>
  </head>
  <body class="assistant-page">
    <header class="topbar"></header>
    <div class="assistant" data-assistant>
      <div class="history-backdrop" data-backdrop></div>
      <aside class="history" id="history" data-history>
        <div class="history-head">
          <button class="icon-button" type="button" data-collapse aria-controls="history" aria-expanded="true"
            data-i18n-aria-label="assistant.collapse">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
          </button>
          <button class="icon-button history-close" type="button" data-close data-i18n-aria-label="assistant.closeHistory">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <button class="history-new" type="button" data-new>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          <span class="history-label" data-i18n="assistant.new"></span>
        </button>
        <nav class="history-nav" data-i18n-aria-label="assistant.history">
          <div data-groups></div>
          <p class="muted small history-empty" data-no-history hidden data-i18n="assistant.noHistory"></p>
        </nav>
      </aside>
      <main class="conversation">
        <div class="conversation-head">
          <button class="icon-button" type="button" aria-controls="history" aria-expanded="false" data-open
            data-i18n-aria-label="assistant.openHistory">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
          </button>
        </div>
        <div class="scroller" data-scroller>
          <div class="messages" data-messages>
            <section class="welcome" data-welcome>
              <h1 data-i18n="assistant.title"></h1>
              <p class="muted" data-i18n="assistant.lead"></p>
              <div class="suggestions" data-suggestions></div>
            </section>
            <ol class="turns" data-turns aria-live="polite"></ol>
            <p class="typing" data-typing hidden><span class="visually-hidden" data-i18n="assistant.typing"></span>
              <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span></p>
          </div>
        </div>
        <div role="alert" class="notice" data-message></div>
        <form class="composer" data-form>
          <label class="visually-hidden" for="message" data-i18n="assistant.message"></label>
          <textarea id="message" name="message" rows="1" maxlength="2000" required
            data-i18n-placeholder="assistant.placeholder"></textarea>
          <button class="send" type="submit" data-i18n-aria-label="assistant.send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </form>
        <p class="muted small composer-hint" data-i18n="assistant.hint"></p>
      </main>
    </div>
    <dialog class="dialog" data-delete-dialog aria-labelledby="delete-title">
      <form method="dialog">
        <h2 id="delete-title" data-i18n="assistant.deleteTitle"></h2>
        <p class="muted" data-delete-text></p>
        <div class="dialog-actions">
          <button class="button quiet" value="cancel" data-i18n="assistant.cancel"></button>
          <button class="button danger" value="delete" data-i18n="assistant.delete"></button>
        </div>
      </form>
    </dialog>
    <script type="module">
      import { startAssistant } from "./js/assistant.js";
      import { renderTopbar } from "./js/auth.js";
      import { t, translatePage } from "./js/i18n.js";

      document.title = t("title.assistant");
      translatePage();
      renderTopbar();
      startAssistant(document.querySelector(".assistant"));
    </script>
  </body>
</html>
