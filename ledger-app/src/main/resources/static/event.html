<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      // Theme and language before anything is drawn, so the page does not flash. ?theme= and ?lang= are for screenshots.
      (() => {
        const root = document.documentElement;
        const asked = new URLSearchParams(location.search);
        try {
          const dark = matchMedia("(prefers-color-scheme: dark)").matches;
          root.dataset.theme = asked.get("theme") || localStorage.getItem("theme") || (dark ? "dark" : "light");
          root.lang = (asked.get("lang") || localStorage.getItem("lang")) === "en" ? "en" : "vi";
        } catch {
          root.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%222%22 y=%228%22 width=%2228%22 height=%2216%22 rx=%223%22 fill=%22%235b2a86%22/%3E%3Ccircle cx=%2222%22 cy=%228%22 r=%223%22 fill=%22%23f6eef2%22/%3E%3Ccircle cx=%2222%22 cy=%2224%22 r=%223%22 fill=%22%23f6eef2%22/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/app.css">
    <title>Sự kiện – Ledgerly</title>
    <script src="vendor/stomp.umd.min.js"></script>
  </head>
  <body>
    <header class="topbar"></header>
    <main>
      <div role="alert" class="notice" data-page-message></div>
      <div data-event>
        <p class="back"><a href="events.html" data-i18n="event.all"></a></p>
        <div class="event-banner" data-banner>
          <div class="poster-caption">
            <h1 data-name></h1>
            <p><time data-starts-at></time></p>
          </div>
        </div>
        <p class="live event-live" data-live data-i18n="event.connecting"></p>
        <div class="event-layout">
          <section aria-labelledby="classes-title">
            <h2 id="classes-title" class="visually-hidden" data-i18n="event.classes"></h2>
            <ul class="stubs" data-stubs></ul>
          </section>
          <section class="panel order-panel" aria-labelledby="order-title" data-order>
            <h2 id="order-title" data-i18n="event.buy"></h2>
            <form class="form" novalidate>
              <div class="field">
                <label for="ticketClass" data-i18n="event.class"></label>
                <select id="ticketClass" name="ticketClass"></select>
              </div>
              <div class="field">
                <label for="quantity" data-i18n="event.quantity"></label>
                <select id="quantity" name="quantity">
                  <option>1</option>
                  <option>2</option>
                  <option>3</option>
                  <option>4</option>
                </select>
              </div>
              <div class="field">
                <label for="wallet" data-i18n="event.wallet"></label>
                <select id="wallet" name="wallet"></select>
              </div>
              <div class="actions">
                <button class="button" type="submit" data-i18n="event.submit"></button>
                <button class="button quiet" type="button" data-resend hidden data-i18n="event.resend"></button>
              </div>
            </form>
            <p data-no-wallet hidden><span data-i18n="event.noWallet"></span> <a href="wallet.html" data-i18n="event.openWallet"></a>.</p>
            <div role="status" class="notice" data-message></div>
          </section>
        </div>
      </div>
    </main>
    <script type="module">
      import { renderTopbar } from "./js/auth.js";
      import { showEvent } from "./js/event.js";
      import { translatePage } from "./js/i18n.js";

      translatePage();
      renderTopbar();
      showEvent(document.querySelector("main"));
    </script>
  </body>
</html>
