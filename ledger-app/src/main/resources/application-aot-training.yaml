# Only for the training run that records the AOT cache while the container image is built (see the Dockerfile).
# No database and no broker exist at that point, so everything that connects to one during startup is turned off.
# An application started with this profile cannot serve requests.
spring:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      # Hibernate would ask the database which product and version it is. Tell it instead.
      hibernate.boot.allow_jdbc_metadata_access: false
      jakarta.persistence.database-product-name: PostgreSQL
      jakarta.persistence.database-major-version: 18
  kafka:
    admin:
      # Creating the topics would wait for a broker.
      auto-create: false

ledgerly:
  outbox:
    relay:
      enabled: false
