openapi: 3.1.0
info:
  description: |-
    E-wallet API on a double-entry ledger: open wallets, deposit, transfer between wallets, read balances and entry history.

    Conventions:

    - **Amounts** are strings holding an integer in the minor unit of the currency (`"150000"` is 150,000 VND), so no client rounds them. Entry amounts are signed from the wallet's side: negative is money out, positive is money in.
    - **Ids** of wallets and transfers are UUIDs.
    - **Requests that move money** need an `Idempotency-Key` header. Retrying with the same key never moves money twice.
    - **Errors** are RFC 9457 Problem Details with the media type `application/problem+json`. The `type` member tells them apart.
    - **Authentication:** sign up at `/v1/auth/register`, sign in at `/v1/auth/login`, and send the access token as `Authorization: Bearer <token>` with every other request.
  title: Ledgerly API
  version: "1"
servers:
- description: The server that serves this document
  url: /
tags:
- description: Buy tickets and read the orders.
  name: Orders
- description: "Open wallets, read their balance and their entry history."
  name: Wallets
- description: "Sign up, and sign in for an access token."
  name: Authentication
- description: "Put money into wallets from the system funding account. For development,\
    \ tests and demos."
  name: Deposits
- description: Events and their ticket classes.
  name: Events
- description: Move money between two wallets.
  name: Transfers
paths:
  /v1/admin/deposits:
    post:
      description: |-
        Credits the wallet and debits the system funding account, which is allowed to go negative, in one database transaction. This is how wallets get money in development, tests and demos: no bank is involved. A user may deposit into their own wallets only, an organizer into any wallet. A wallet the caller may not deposit into answers `wallet-not-found`.

        The call needs an `Idempotency-Key`, with the same rules as a transfer: a retry with the same key returns the stored response with `Idempotent-Replayed: true` and credits nothing again. The response has no `Location`: a deposit cannot be read back on its own, it appears as an entry of the wallet.
      operationId: createDeposit
      parameters:
      - description: "Identifies this operation, so that it is safe to send again.\
          \ Generate one value for each operation (a UUID is recommended) and send\
          \ that same value on every retry of it. 1 to 64 visible ASCII characters.\
          \ The key and the response stored under it are kept for at least 24 hours.\
          \ Keys are per user: another user's key with the same value is a different\
          \ key."
        example: 9b2e4c1a-7d3f-4a6b-8c5d-0e1f2a3b4c5d
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          pattern: "[\\x21-\\x7E]{1,64}"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositResponse"
          description: The deposit is complete. Also the answer when a completed deposit
            is retried with the same Idempotency-Key.
          headers:
            Idempotent-Replayed:
              description: "Present with the value `true` when this is the stored\
                \ response of an earlier request with the same Idempotency-Key, and\
                \ nothing was done again."
              schema:
                type: string
                enum:
                - "true"
              style: simple
        "400":
          content:
            application/problem+json:
              examples:
                validation-error:
                  description: "The body, a parameter or a header is missing or malformed.\
                    \ Nothing was done, and an Idempotency-Key sent with the request\
                    \ was not used up."
                  summary: Request is not valid
                  value:
                    status: 400
                    title: Request is not valid
                    type: /problems/validation-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request is not valid
        "401":
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  description: "The request has no access token, or its token is expired\
                    \ or invalid. Sign in at /v1/auth/login and send the token as\
                    \ Authorization: Bearer <token>."
                  summary: Authentication required
                  value:
                    status: 401
                    title: Authentication required
                    type: /problems/unauthenticated
              schema:
                $ref: "#/components/schemas/Problem"
          description: Authentication required
        "404":
          content:
            application/problem+json:
              examples:
                wallet-not-found:
                  description: No wallet has this id. System accounts are not wallets.
                  summary: Wallet not found
                  value:
                    status: 404
                    title: Wallet not found
                    type: /problems/wallet-not-found
              schema:
                $ref: "#/components/schemas/Problem"
          description: Wallet not found
        "409":
          content:
            application/problem+json:
              examples:
                idempotency-in-progress:
                  description: "An earlier request with the same Idempotency-Key has\
                    \ not finished. Wait for the time in Retry-After, then send the\
                    \ request again with the same key."
                  summary: Request with this Idempotency-Key is still in progress
                  value:
                    status: 409
                    title: Request with this Idempotency-Key is still in progress
                    type: /problems/idempotency-in-progress
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request with this Idempotency-Key is still in progress
          headers:
            Retry-After:
              description: Seconds to wait before sending the same request again.
              schema:
                type: integer
                format: int32
                example: 1
        "422":
          content:
            application/problem+json:
              examples:
                balance-limit-exceeded:
                  description: The amount would take a balance past the largest value
                    the ledger can hold. No money moved.
                  summary: Balance limit exceeded
                  value:
                    status: 422
                    title: Balance limit exceeded
                    type: /problems/balance-limit-exceeded
                currency-mismatch:
                  description: The currency of the request is not the currency of
                    a wallet it names.
                  summary: Currency does not match the wallet
                  value:
                    status: 422
                    title: Currency does not match the wallet
                    type: /problems/currency-mismatch
                idempotency-key-reused:
                  description: "The Idempotency-Key was first sent with another method,\
                    \ path or body. Use a new key for every operation."
                  summary: Idempotency-Key was already used with a different request
                  value:
                    status: 422
                    title: Idempotency-Key was already used with a different request
                    type: /problems/idempotency-key-reused
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Idempotency-Key was already used with a different request,\
            \ or: Currency does not match the wallet, or: Balance limit exceeded"
        "500":
          content:
            application/problem+json:
              examples:
                internal-error:
                  description: "Something unexpected failed. The cause is in the server\
                    \ log, not in the response. A request that moves money was rolled\
                    \ back and may be retried with the same Idempotency-Key."
                  summary: Internal error
                  value:
                    status: 500
                    title: Internal error
                    type: /problems/internal-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal error
        "503":
          content:
            application/problem+json:
              examples:
                overloaded:
                  description: "The request could not get the locks it needs in time.\
                    \ Nothing was done. Wait for the time in Retry-After, then send\
                    \ the request again with the same Idempotency-Key."
                  summary: Service is overloaded
                  value:
                    status: 503
                    title: Service is overloaded
                    type: /problems/overloaded
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service is overloaded
          headers:
            Retry-After:
              description: Seconds to wait before sending the same request again.
              schema:
                type: integer
                format: int32
                example: 1
      security:
      - bearerAuth: []
      summary: Deposit money into a wallet
      tags:
      - Deposits
  /v1/auth/login:
    post:
      description: "Exchanges email and password for an access token. A wrong password\
        \ and an unknown email get the same answer, so the API does not tell which\
        \ emails are registered."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: The access token.
        "400":
          content:
            application/problem+json:
              examples:
                validation-error:
                  description: "The body, a parameter or a header is missing or malformed.\
                    \ Nothing was done, and an Idempotency-Key sent with the request\
                    \ was not used up."
                  summary: Request is not valid
                  value:
                    status: 400
                    title: Request is not valid
                    type: /problems/validation-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request is not valid
        "401":
          content:
            application/problem+json:
              examples:
                invalid-credentials:
                  description: "No user has this email, or the password does not match.\
                    \ The two cases get the same answer."
                  summary: Email or password is wrong
                  value:
                    status: 401
                    title: Email or password is wrong
                    type: /problems/invalid-credentials
              schema:
                $ref: "#/components/schemas/Problem"
          description: Email or password is wrong
        "500":
          content:
            application/problem+json:
              examples:
                internal-error:
                  description: "Something unexpected failed. The cause is in the server\
                    \ log, not in the response. A request that moves money was rolled\
                    \ back and may be retried with the same Idempotency-Key."
                  summary: Internal error
                  value:
                    status: 500
                    title: Internal error
                    type: /problems/internal-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal error
      summary: Sign in
      tags:
      - Authentication
  /v1/auth/register:
    post:
      description: "Creates a user. Emails are unique regardless of case. The role\
        \ defaults to USER. Signing up does not sign in: call `login` next."
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: The user was created.
        "400":
          content:
            application/problem+json:
              examples:
                validation-error:
                  description: "The body, a parameter or a header is missing or malformed.\
                    \ Nothing was done, and an Idempotency-Key sent with the request\
                    \ was not used up."
                  summary: Request is not valid
                  value:
                    status: 400
                    title: Request is not valid
                    type: /problems/validation-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request is not valid
        "409":
          content:
            application/problem+json:
              examples:
                email-taken:
                  description: A user with this email exists. Emails are compared
                    regardless of case. Sign in instead.
                  summary: Email is already registered
                  value:
                    status: 409
                    title: Email is already registered
                    type: /problems/email-taken
              schema:
                $ref: "#/components/schemas/Problem"
          description: Email is already registered
        "500":
          content:
            application/problem+json:
              examples:
                internal-error:
                  description: "Something unexpected failed. The cause is in the server\
                    \ log, not in the response. A request that moves money was rolled\
                    \ back and may be retried with the same Idempotency-Key."
                  summary: Internal error
                  value:
                    status: 500
                    title: Internal error
                    type: /problems/internal-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal error
      summary: Sign up
      tags:
      - Authentication
  /v1/events:
    get:
      description: "Returns the events that have not started yet, soonest first, one\
        \ page at a time. Each event shows the price of its cheapest ticket. No sign-in\
        \ needed. The list is cached: an event can still appear for up to 30 seconds\
        \ after it started."
      operationId: listEvents
      parameters:
      - description: "Number of the page, from 0."
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: "Largest number of events in the page, from 1 to 50."
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 50
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPageResponse"
          description: One page of events.
        "400":
          content:
            application/problem+json:
              examples:
                validation-error:
                  description: "The body, a parameter or a header is missing or malformed.\
                    \ Nothing was done, and an Idempotency-Key sent with the request\
                    \ was not used up."
                  summary: Request is not valid
                  value:
                    status: 400
                    title: Request is not valid
                    type: /problems/validation-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request is not valid
        "500":
          content:
            application/problem+json:
              examples:
                internal-error:
                  description: "Something unexpected failed. The cause is in the server\
                    \ log, not in the response. A request that moves money was rolled\
                    \ back and may be retried with the same Idempotency-Key."
                  summary: Internal error
                  value:
                    status: 500
                    title: Internal error
                    type: /problems/internal-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal error
      summary: List upcoming events
      tags:
      - Events
    post:
      description: |-
        Creates an event with its ticket classes. Only organizers create events, and the money of every \
        ticket sold is paid into `payoutWalletId`, which must be one of the caller's wallets. Ticket classes \
        cannot be changed afterwards: every class starts with all its tickets for sale.
      operationId: createEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: The event was created.
          headers:
            Location:
              description: Path of the new event.
              schema:
                type: string
                example: /v1/events/01a11ad9-7f10-7459-a273-deb24dbb4296
              style: simple
        "400":
          content:
            application/problem+json:
              examples:
                validation-error:
                  description: "The body, a parameter or a header is missing or malformed.\
                    \ Nothing was done, and an Idempotency-Key sent with the request\
                    \ was not used up."
                  summary: Request is not valid
                  value:
                    status: 400
                    title: Request is not valid
                    type: /problems/validation-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request is not valid
        "401":
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  description: "The request has no access token, or its token is expired\
                    \ or invalid. Sign in at /v1/auth/login and send the token as\
                    \ Authorization: Bearer <token>."
                  summary: Authentication required
                  value:
                    status: 401
                    title: Authentication required
                    type: /problems/unauthenticated
              schema:
                $ref: "#/components/schemas/Problem"
          description: Authentication required
        "403":
          content:
            application/problem+json:
              examples:
                forbidden:
                  description: "The caller is signed in, but their role may not do\
                    \ this. Only organizers create events."
                  summary: Not allowed for your role
                  value:
                    status: 403
                    title: Not allowed for your role
                    type: /problems/forbidden
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not allowed for your role
        "422":
          content:
            application/problem+json:
              examples:
                payout-wallet-invalid:
                  description: The wallet that should receive the money of the tickets
                    is not one of the caller's wallets.
                  summary: Payout wallet is not yours
                  value:
                    status: 422
                    title: Payout wallet is not yours
                    type: /problems/payout-wallet-invalid
              schema:
                $ref: "#/components/schemas/Problem"
          description: Payout wallet is not yours
        "500":
          content:
            application/problem+json:
              examples:
                internal-error:
                  description: "Something unexpected failed. The cause is in the server\
                    \ log, not in the response. A request that moves money was rolled\
                    \ back and may be retried with the same Idempotency-Key."
                  summary: Internal error
                  value:
                    status: 500
                    title: Internal error
                    type: /problems/internal-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal error
      security:
      - bearerAuth: []
      summary: Create an event
      tags:
      - Events
  /v1/events/{id}:
    get:
      description: "Returns an event with its ticket classes and the tickets left\
        \ in each, read at the time of the request. Events that have started can still\
        \ be read. No sign-in needed."
      operationId: getEvent
      parameters:
      - description: Id of the event.
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: The event.
        "400":
          content:
            application/problem+json:
              examples:
                validation-error:
                  description: "The body, a parameter or a header is missing or malformed.\
                    \ Nothing was done, and an Idempotency-Key sent with the request\
                    \ was not used up."
                  summary: Request is not valid
                  value:
                    status: 400
                    title: Request is not valid
                    type: /problems/validation-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request is not valid
        "404":
          content:
            application/problem+json:
              examples:
                event-not-found:
                  description: "No event has this id. When editing, an event of another\
                    \ organizer is reported the same way."
                  summary: Event not found
                  value:
                    status: 404
                    title: Event not found
                    type: /problems/event-not-found
              schema:
                $ref: "#/components/schemas/Problem"
          description: Event not found
        "500":
          content:
            application/problem+json:
              examples:
                internal-error:
                  description: "Something unexpected failed. The cause is in the server\
                    \ log, not in the response. A request that moves money was rolled\
                    \ back and may be retried with the same Idempotency-Key."
                  summary: Internal error
                  value:
                    status: 500
                    title: Internal error
                    type: /problems/internal-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal error
      summary: Read an event
      tags:
      - Events
    patch:
      description: |-
        Changes the name and the start of one of the caller's events. Ticket classes, prices and the payout \
        wallet stay as they are. An event of another organizer answers `event-not-found`, just like one \
        that does not exist.
      operationId: updateEvent
      parameters:
      - description: "Id of the event, as returned when it was created."
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: The event as it is now.
        "400":
          content:
            application/problem+json:
              examples:
                validation-error:
                  description: "The body, a parameter or a header is missing or malformed.\
                    \ Nothing was done, and an Idempotency-Key sent with the request\
                    \ was not used up."
                  summary: Request is not valid
                  value:
                    status: 400
                    title: Request is not valid
                    type: /problems/validation-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request is not valid
        "401":
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  description: "The request has no access token, or its token is expired\
                    \ or invalid. Sign in at /v1/auth/login and send the token as\
                    \ Authorization: Bearer <token>."
                  summary: Authentication required
                  value:
                    status: 401
                    title: Authentication required
                    type: /problems/unauthenticated
              schema:
                $ref: "#/components/schemas/Problem"
          description: Authentication required
        "404":
          content:
            application/problem+json:
              examples:
                event-not-found:
                  description: "No event has this id. When editing, an event of another\
                    \ organizer is reported the same way."
                  summary: Event not found
                  value:
                    status: 404
                    title: Event not found
                    type: /problems/event-not-found
              schema:
                $ref: "#/components/schemas/Problem"
          description: Event not found
        "500":
          content:
            application/problem+json:
              examples:
                internal-error:
                  description: "Something unexpected failed. The cause is in the server\
                    \ log, not in the response. A request that moves money was rolled\
                    \ back and may be retried with the same Idempotency-Key."
                  summary: Internal error
                  value:
                    status: 500
                    title: Internal error
                    type: /problems/internal-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal error
      security:
      - bearerAuth: []
      summary: Rename or reschedule an event
      tags:
      - Events
  /v1/orders:
    get:
      description: "Returns the caller's orders, newest first, one page at a time.\
        \ Orders of other users are never listed."
      operationId: listOrders
      parameters:
      - description: "Number of the page, from 0."
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: "Largest number of orders in the page, from 1 to 50."
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 50
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPageResponse"
          description: One page of orders.
        "400":
          content:
            application/problem+json:
              examples:
                validation-error:
                  description: "The body, a parameter or a header is missing or malformed.\
                    \ Nothing was done, and an Idempotency-Key sent with the request\
                    \ was not used up."
                  summary: Request is not valid
                  value:
                    status: 400
                    title: Request is not valid
                    type: /problems/validation-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request is not valid
        "401":
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  description: "The request has no access token, or its token is expired\
                    \ or invalid. Sign in at /v1/auth/login and send the token as\
                    \ Authorization: Bearer <token>."
                  summary: Authentication required
                  value:
                    status: 401
                    title: Authentication required
                    type: /problems/unauthenticated
              schema:
                $ref: "#/components/schemas/Problem"
          description: Authentication required
        "500":
          content:
            application/problem+json:
              examples:
                internal-error:
                  description: "Something unexpected failed. The cause is in the server\
                    \ log, not in the response. A request that moves money was rolled\
                    \ back and may be retried with the same Idempotency-Key."
                  summary: Internal error
                  value:
                    status: 500
                    title: Internal error
                    type: /problems/internal-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal error
      security:
      - bearerAuth: []
      summary: List my orders
      tags:
      - Orders
    post:
      description: |-
        Buys 1 to 4 tickets of one class and pays for them from one of the caller's wallets, in a single \
        database transaction: either the tickets are taken, the money is paid to the organizer and the order \
        exists, or nothing changed at all. No two buyers can get the same last ticket.

        The call needs an `Idempotency-Key`. Sending it again with the same key never buys twice: it returns \
        the stored response of the first attempt with `Idempotent-Replayed: true`. That holds for rejections \
        too: a purchase refused with `sold-out` or `insufficient-funds` stays refused under its key.
      operationId: createOrder
      parameters:
      - description: "Identifies this operation, so that it is safe to send again.\
          \ Generate one value for each operation (a UUID is recommended) and send\
          \ that same value on every retry of it. 1 to 64 visible ASCII characters.\
          \ The key and the response stored under it are kept for at least 24 hours.\
          \ Keys are per user: another user's key with the same value is a different\
          \ key."
        example: 3c9a7e10-5b2d-4f6e-9a1c-7d8e9f0a1b2c
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          pattern: "[\\x21-\\x7E]{1,64}"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
          description: The tickets are bought. Also the answer when a purchase is
            retried with the same key.
          headers:
            Idempotent-Replayed:
              description: "Present with the value `true` when this is the stored\
                \ response of an earlier request with the same Idempotency-Key, and\
                \ nothing was done again."
              schema:
                type: string
                enum:
