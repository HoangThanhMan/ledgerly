                    status: 500
                    title: Internal error
                    type: /problems/internal-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal error
      security:
      - bearerAuth: []
      summary: Read a wallet
      tags:
      - Wallets
  /v1/wallets/{id}/entries:
    get:
      description: |-
        Returns the ledger entries of the wallet, newest first. Every completed transfer or deposit adds one entry to each account it touches, and an entry is never changed or deleted, so this is the full history of the balance.

        Pages are read by keyset, not by offset: take `nextCursor` from a page and pass it as `after` to get the next, older page. `nextCursor` is null on the last page. Entries written while you page only appear in front of the first page, so no page repeats or skips an entry.
      operationId: listWalletEntries
      parameters:
      - description: "Id of the wallet, as returned when it was opened."
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Return only entries older than the entry with this id. Pass the
          `nextCursor` of the previous page. Leave it out for the first page.
        example: 1042
        in: query
        name: after
        required: false
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - description: "Largest number of entries in the page, from 1 to 100."
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryPageResponse"
          description: "One page of entries, newest first."
        "400":
          content:
            application/problem+json:
              examples:
                validation-error:
                  description: "The body, a parameter or a header is missing or malformed.\
                    \ Nothing was done, and an Idempotency-Key sent with the request\
                    \ was not used up."
                  summary: Request is not valid
                  value:
                    status: 400
                    title: Request is not valid
                    type: /problems/validation-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request is not valid
        "401":
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  description: "The request has no access token, or its token is expired\
                    \ or invalid. Sign in at /v1/auth/login and send the token as\
                    \ Authorization: Bearer <token>."
                  summary: Authentication required
                  value:
                    status: 401
                    title: Authentication required
                    type: /problems/unauthenticated
              schema:
                $ref: "#/components/schemas/Problem"
          description: Authentication required
        "404":
          content:
            application/problem+json:
              examples:
                wallet-not-found:
                  description: No wallet has this id. System accounts are not wallets.
                  summary: Wallet not found
                  value:
                    status: 404
                    title: Wallet not found
                    type: /problems/wallet-not-found
              schema:
                $ref: "#/components/schemas/Problem"
          description: Wallet not found
        "500":
          content:
            application/problem+json:
              examples:
                internal-error:
                  description: "Something unexpected failed. The cause is in the server\
                    \ log, not in the response. A request that moves money was rolled\
                    \ back and may be retried with the same Idempotency-Key."
                  summary: Internal error
                  value:
                    status: 500
                    title: Internal error
                    type: /problems/internal-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal error
      security:
      - bearerAuth: []
      summary: List the entries of a wallet
      tags:
      - Wallets
components:
  schemas:
    CreateEventRequest:
      type: object
      description: "An event to create, with its ticket classes."
      properties:
        name:
          type: string
          description: "Name of the event, 1 to 200 characters."
          example: Ledgerly Live
          maxLength: 200
          minLength: 0
        payoutWalletId:
          type: string
          format: uuid
          description: One of the caller's wallets. The money of every ticket sold
            is paid into it.
        startsAt:
          type: string
          format: date-time
          description: When the event starts. Must be in the future.
          example: 2027-03-01T12:00:00Z
        ticketClasses:
          type: array
          description: 1 to 10 ticket classes. They cannot be changed once the event
            exists.
          items:
            $ref: "#/components/schemas/TicketClassRequest"
          maxItems: 10
          minItems: 1
      required:
      - name
      - payoutWalletId
      - startsAt
      - ticketClasses
    DepositRequest:
      type: object
      description: The deposit to make.
      properties:
        amount:
          type: string
          description: "Amount to credit, as a string holding a positive integer in\
            \ the minor unit of the currency. No sign, no leading zeros, no decimals,\
            \ at most 18 digits."
          example: "500000"
          pattern: "[1-9][0-9]{0,17}"
        currency:
          type: string
          description: ISO 4217 code of the currency. Must be the currency of the
            wallet. Only VND is supported.
          example: VND
        walletId:
          type: string
          format: uuid
          description: Wallet to credit.
          example: 01a11ad9-7eb8-7b3e-9d1f-2f3c6f1c2a10
      required:
      - amount
      - currency
      - walletId
    DepositResponse:
      type: object
      description: A completed deposit.
      properties:
        amount:
          type: string
          description: "Amount credited, as a string holding a positive integer in\
            \ the minor unit of the currency."
          example: "500000"
        createdAt:
          type: string
          format: date-time
          description: When the deposit was committed.
        currency:
          type: string
          description: ISO 4217 code of the currency.
          example: VND
        id:
          type: string
          format: uuid
          description: Id of the deposit. Also the `transactionId` of the entry it
            wrote to the wallet.
          example: 01a11ad9-7f10-7459-a273-deb24dbb4296
        status:
          type: string
          description: "Always `COMPLETED`: a deposit that exists has credited the\
            \ wallet."
          enum:
          - COMPLETED
        walletId:
          type: string
          format: uuid
          description: Wallet that was credited.
          example: 01a11ad9-7eb8-7b3e-9d1f-2f3c6f1c2a10
    EntryPageResponse:
      type: object
      description: One page of the entries of a wallet.
      properties:
        items:
          type: array
          description: "The entries of this page, newest first. Empty when the wallet\
            \ has no entries, or none older than `after`."
          items:
            $ref: "#/components/schemas/EntryResponse"
        nextCursor:
          type:
          - string
          - "null"
          description: "Pass as `after` to read the next, older page. Null when this\
            \ is the last page."
          example: "1041"
    EntryResponse:
      type: object
      description: "One ledger entry of a wallet: a single change of its balance."
      properties:
        amount:
          type: string
          description: "Change of the balance, as a string holding a signed integer\
            \ in the minor unit of the currency: negative is money out, positive is\
            \ money in. Never 0."
          example: "-150000"
        balanceAfter:
          type: string
          description: "Balance of the wallet right after this entry, in the same\
            \ format as the balance of a wallet."
          example: "350000"
        createdAt:
          type: string
          format: date-time
          description: When the entry was written.
        currency:
          type: string
          description: ISO 4217 code of the wallet's currency.
          example: VND
        id:
          type: string
          description: "Id of the entry, an integer sent as a string. Newer entries\
            \ have larger ids. Usable as `after` when paging."
          example: "1042"
        transactionId:
          type: string
          format: uuid
          description: Id of the transfer or deposit that wrote the entry.
          example: 01a11ad9-7f10-7459-a273-deb24dbb4296
    EventPageResponse:
      type: object
      description: "One page of the events that have not started yet, soonest first."
      properties:
        items:
          type: array
          description: The events of this page.
          items:
            $ref: "#/components/schemas/EventSummaryResponse"
        page:
          type: integer
          format: int32
          description: "Number of this page, from 0."
          example: 0
        size:
          type: integer
          format: int32
          description: Largest number of events in a page.
          example: 20
        totalItems:
          type: integer
          format: int64
          description: Number of events on all pages together.
          example: 42
    EventResponse:
      type: object
      description: An event with its ticket classes and the tickets left in each.
      properties:
        id:
          type: string
          format: uuid
          description: Id of the event.
        name:
          type: string
          description: Name of the event.
          example: Ledgerly Live
        payoutWalletId:
          type: string
          format: uuid
          description: The organizer's wallet that receives the money of the tickets
            sold.
        startsAt:
          type: string
          format: date-time
          description: When the event starts.
          example: 2027-03-01T12:00:00Z
        ticketClasses:
          type: array
          description: "The ticket classes, cheapest first."
          items:
            $ref: "#/components/schemas/TicketClassResponse"
    EventSummaryResponse:
      type: object
      description: An event in the event list.
      properties:
        id:
          type: string
          format: uuid
          description: Id of the event.
        minPrice:
          type: string
          description: "Price of the cheapest ticket, as a string of VND."
          example: "300000"
        name:
          type: string
          description: Name of the event.
          example: Ledgerly Live
        startsAt:
          type: string
          format: date-time
          description: When the event starts.
          example: 2027-03-01T12:00:00Z
    LoginRequest:
      type: object
      description: Credentials of a registered user.
      properties:
        email:
          type: string
          description: Email given at sign-up. Case does not matter.
          example: an@example.com
          minLength: 1
        password:
          type: string
          description: The password.
          example: correct-horse-battery
      required:
      - email
      - password
    OpenWalletRequest:
      type: object
      description: The wallet to open.
      properties:
        currency:
          type: string
          description: ISO 4217 code of the wallet's currency. Only VND is supported.
          example: VND
      required:
      - currency
    OrderPageResponse:
      type: object
      description: "One page of the caller's orders, newest first."
      properties:
        items:
          type: array
          description: The orders of this page.
          items:
            $ref: "#/components/schemas/OrderResponse"
        page:
          type: integer
          format: int32
          description: "Number of this page, from 0."
          example: 0
        size:
          type: integer
          format: int32
          description: Largest number of orders in a page.
          example: 20
        totalItems:
          type: integer
          format: int64
          description: Number of orders on all pages together.
          example: 3
    OrderResponse:
      type: object
      description: "A ticket order. It exists only once it is paid: there is no pending\
        \ order."
      properties:
        amount:
          type: string
          description: "Price paid for all the tickets, as a string of minor units."
          example: "1000000"
        createdAt:
          type: string
          format: date-time
          description: When the order was paid.
        currency:
          type: string
          description: ISO 4217 code of the currency.
          example: VND
        eventId:
          type: string
          format: uuid
          description: The event the tickets are for.
        id:
          type: string
          format: uuid
          description: Id of the order.
        ledgerTransactionId:
          type: string
          format: uuid
          description: The ledger transaction that paid for the order.
        quantity:
          type: integer
          format: int32
          description: Number of tickets.
          example: 2
        ticketClassId:
          type: string
          format: uuid
          description: The ticket class the tickets are of.
        walletId:
          type: string
          format: uuid
          description: The wallet the tickets were paid from.
    Problem:
      type: object
      description: "An error, as RFC 9457 Problem Details. Every error of the API\
        \ has this shape. Tell errors apart by `type`, never by `title` or `detail`."
      properties:
        detail:
          type: string
          description: "What went wrong in this occurrence, for a human to read."
          example: "Wallet 01a11ad9-7eb8-7b3e-9d1f-2f3c6f1c2a10 has 350000 VND, the\
            \ transfer needs 9999999 VND"
        errors:
          type: array
          description: "Only on `validation-error`, and only when the rejected inputs\
            \ are known: one item per rejected input."
          items:
            type: object
            properties:
              field:
                type: string
                description: "The JSON field, query parameter or header that was rejected."
                example: amount
              message:
                type: string
                description: Why it was rejected.
                example: must be a positive integer of minor units with at most 18
                  digits
        instance:
          type: string
          description: Path of the request that failed.
          example: /v1/transfers
        status:
          type: integer
          format: int32
          description: The HTTP status of the response.
          example: 422
        title:
          type: string
          description: "Short name of the kind of problem, the same for every occurrence."
          example: Insufficient funds
        type:
          type: string
          description: "Identifies the kind of problem. Stable: safe to branch on.\
            \ Errors raised by the HTTP layer itself, such as an unknown path or a\
            \ method that is not allowed, have no `type`."
          enum:
          - /problems/validation-error
          - /problems/wallet-not-found
          - /problems/transfer-not-found
          - /problems/event-not-found
          - /problems/ticket-class-not-found
          - /problems/sold-out
          - /problems/order-not-found
          - /problems/idempotency-in-progress
          - /problems/idempotency-key-reused
          - /problems/unauthenticated
          - /problems/forbidden
          - /problems/invalid-credentials
          - /problems/email-taken
          - /problems/insufficient-funds
          - /problems/same-account-transfer
          - /problems/currency-mismatch
          - /problems/balance-limit-exceeded
          - /problems/payout-wallet-invalid
          - /problems/quantity-out-of-range
          - /problems/sales-closed
          - /problems/unsupported-currency
          - /problems/internal-error
          - /problems/overloaded
          example: /problems/insufficient-funds
    PurchaseRequest:
      type: object
      description: "Tickets to buy, and the wallet to pay with."
      properties:
        quantity:
          type: integer
          format: int32
          description: "Number of tickets, from 1 to 4."
          example: 2
        ticketClassId:
          type: string
          format: uuid
          description: The ticket class to buy from.
        walletId:
          type: string
          format: uuid
          description: One of the caller's wallets. The tickets are paid from it.
      required:
      - quantity
      - ticketClassId
      - walletId
    RegisterRequest:
      type: object
      description: A new user.
      properties:
        email:
          type: string
          format: email
          description: Email to sign in with. Case does not matter.
          example: an@example.com
          maxLength: 254
          minLength: 0
        password:
          type: string
          description: "8 to 72 characters, and at most 72 bytes in UTF-8."
          example: correct-horse-battery
          maxLength: 72
          minLength: 8
        role:
          type: string
          description: USER (the default) buys tickets. ORGANIZER also runs events.
          enum:
          - USER
          - ORGANIZER
          example: USER
      required:
      - email
      - password
    TicketClassRequest:
      type: object
      description: "A class of tickets with one price, such as A, B or VIP."
      properties:
        name:
          type: string
          description: "Unique within the event, 1 to 50 characters."
          example: VIP
          maxLength: 50
          minLength: 0
        price:
          type: string
          description: "Price of one ticket: a positive integer of VND, at most 1,000,000,000."
          example: "2000000"
          pattern: "[1-9][0-9]{0,9}"
        totalQty:
          type: integer
          format: int32
          description: "Number of tickets, from 1 to 100,000."
          example: 100
          maximum: 100000
          minimum: 1
      required:
      - name
      - price
    TicketClassResponse:
      type: object
      description: A class of tickets of an event.
      properties:
        currency:
          type: string
          description: "VND, the only currency."
          example: VND
        id:
          type: string
          format: uuid
          description: Id of the ticket class. Orders name it.
        name:
          type: string
          description: "Name, unique within the event."
          example: VIP
        price:
          type: string
          description: "Price of one ticket, as a string of VND."
          example: "2000000"
        remaining:
          type: integer
          format: int32
          description: Tickets still for sale when the response was made.
          example: 42
        totalQty:
          type: integer
          format: int32
          description: Tickets the class started with.
          example: 100
    TokenResponse:
      type: object
      description: "An access token. Send it as `Authorization: Bearer <accessToken>`."
      properties:
        accessToken:
          type: string
          description: A JWT.
        expiresIn:
          type: integer
          format: int64
          description: Seconds until the token expires.
          example: 3600
        tokenType:
          type: string
          description: Always `Bearer`.
          example: Bearer
    TransferRequest:
      type: object
      description: The transfer to make.
      properties:
        amount:
          type: string
          description: "Amount to move, as a string holding a positive integer in\
            \ the minor unit of the currency. No sign, no leading zeros, no decimals,\
            \ at most 18 digits."
          example: "150000"
          pattern: "[1-9][0-9]{0,17}"
        currency:
          type: string
          description: ISO 4217 code of the currency. Must be the currency of both
            wallets. Only VND is supported.
          example: VND
        sourceWalletId:
          type: string
          format: uuid
          description: Wallet the money leaves. It must hold at least the amount.
          example: 01a11ad9-7eb8-7b3e-9d1f-2f3c6f1c2a10
        targetWalletId:
          type: string
          format: uuid
          description: Wallet the money goes to. Must differ from the source wallet.
          example: 01a11ad9-7ec9-7c41-8e2a-5b7d9c0e4f21
      required:
      - amount
      - currency
      - sourceWalletId
      - targetWalletId
    TransferResponse:
      type: object
      description: A completed transfer.
      properties:
        amount:
          type: string
          description: "Amount moved, as a string holding a positive integer in the\
            \ minor unit of the currency."
          example: "150000"
        createdAt:
          type: string
          format: date-time
          description: When the transfer was committed.
        currency:
          type: string
          description: ISO 4217 code of the currency.
          example: VND
        id:
          type: string
          format: uuid
          description: Id of the transfer. Also the `transactionId` of the two entries
            it wrote.
          example: 01a11ad9-7f10-7459-a273-deb24dbb4296
        sourceWalletId:
          type: string
          format: uuid
          description: Wallet the money left.
          example: 01a11ad9-7eb8-7b3e-9d1f-2f3c6f1c2a10
        status:
          type: string
          description: "Always `COMPLETED`: a transfer that exists has moved the money."
          enum:
          - COMPLETED
        targetWalletId:
          type: string
          format: uuid
          description: Wallet the money went to.
          example: 01a11ad9-7ec9-7c41-8e2a-5b7d9c0e4f21
    UpdateEventRequest:
      type: object
      description: The new name and start of an event.
      properties:
        name:
          type: string
          description: "Name of the event, 1 to 200 characters."
          example: Ledgerly Live
          maxLength: 200
          minLength: 0
        startsAt:
          type: string
          format: date-time
          description: When the event starts. Must be in the future.
          example: 2027-03-01T12:00:00Z
      required:
      - name
      - startsAt
    UserResponse:
      type: object
      description: A user. The password is never returned.
      properties:
        createdAt:
          type: string
          format: date-time
          description: When the user signed up.
        email:
          type: string
          description: In lower case.
        id:
          type: string
          format: uuid
          description: Id of the user. Access tokens carry it as their subject.
        role:
          type: string
          description: What the user may do.
          enum:
          - USER
          - ORGANIZER
    WalletListResponse:
      type: object
      description: The caller's wallets.
      properties:
        items:
          type: array
          description: "The wallets, oldest first."
          items:
            $ref: "#/components/schemas/WalletResponse"
    WalletResponse:
      type: object
      description: A wallet and its current balance.
      properties:
        balance:
          type: string
          description: "Current balance, as a string holding a non-negative integer\
            \ in the minor unit of the currency."
          example: "350000"
        createdAt:
          type: string
          format: date-time
          description: When the wallet was opened.
        currency:
          type: string
          description: ISO 4217 code of the wallet's currency.
          example: VND
        id:
          type: string
          format: uuid
          description: Id of the wallet.
          example: 01a11ad9-7eb8-7b3e-9d1f-2f3c6f1c2a10
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Access token from /v1/auth/login.
      scheme: bearer
      type: http
