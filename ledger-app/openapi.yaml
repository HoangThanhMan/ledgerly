  /v1/transfers:
    post:
      description: |-
        Moves `amount` from the source wallet to the target wallet in a single database transaction: either both balances change and two entries are written, or nothing changes at all. The transfer is complete when the call returns 201, there is no pending state. A completed transfer also publishes a `TransferCompleted` event.

        The call needs an `Idempotency-Key`. Sending the same request again with the same key never moves the money twice: it returns the stored response of the first attempt with the header `Idempotent-Replayed: true`. That holds for business rejections too: a transfer refused with `insufficient-funds` stays refused under its key even after the wallet is topped up, so a new attempt needs a new key.

        When the outcome is unknown, retry with the same key: after a lost connection, a 409, a 500 or a 503. In those cases nothing was stored and no money moved, or the first attempt is still running.
      operationId: createTransfer
      parameters:
      - description: "Identifies this operation, so that it is safe to send again.\
          \ Generate one value for each operation (a UUID is recommended) and send\
          \ that same value on every retry of it. 1 to 64 visible ASCII characters.\
          \ The key and the response stored under it are kept for at least 24 hours.\
          \ Keys are per user: another user's key with the same value is a different\
          \ key."
        example: 6f1c2d3e-4a5b-4c6d-8e7f-9a0b1c2d3e4f
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          pattern: "[\\x21-\\x7E]{1,64}"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
          description: The transfer is complete. Also the answer when a completed
            transfer is retried with the same Idempotency-Key.
          headers:
            Idempotent-Replayed:
              description: "Present with the value `true` when this is the stored\
                \ response of an earlier request with the same Idempotency-Key, and\
                \ nothing was done again."
              schema:
                type: string
                enum:
                - "true"
              style: simple
            Location:
              description: Path of the transfer.
              schema:
                type: string
                example: /v1/transfers/01a11ad9-7f10-7459-a273-deb24dbb4296
              style: simple
        "400":
          content:
            application/problem+json:
              examples:
                validation-error:
                  description: "The body, a parameter or a header is missing or malformed.\
                    \ Nothing was done, and an Idempotency-Key sent with the request\
                    \ was not used up."
                  summary: Request is not valid
                  value:
                    status: 400
                    title: Request is not valid
                    type: /problems/validation-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request is not valid
        "401":
          content:
            application/problem+json:
              examples:
                unauthenticated:
                  description: "The request has no access token, or its token is expired\
                    \ or invalid. Sign in at /v1/auth/login and send the token as\
                    \ Authorization: Bearer <token>."
                  summary: Authentication required
                  value:
                    status: 401
                    title: Authentication required
                    type: /problems/unauthenticated
              schema:
                $ref: "#/components/schemas/Problem"
          description: Authentication required
        "404":
          content:
            application/problem+json:
              examples:
                wallet-not-found:
                  description: No wallet has this id. System accounts are not wallets.
                  summary: Wallet not found
                  value:
                    status: 404
                    title: Wallet not found
                    type: /problems/wallet-not-found
              schema:
                $ref: "#/components/schemas/Problem"
          description: Wallet not found
        "409":
          content:
            application/problem+json:
              examples:
                idempotency-in-progress:
                  description: "An earlier request with the same Idempotency-Key has\
                    \ not finished. Wait for the time in Retry-After, then send the\
                    \ request again with the same key."
                  summary: Request with this Idempotency-Key is still in progress
                  value:
                    status: 409
                    title: Request with this Idempotency-Key is still in progress
                    type: /problems/idempotency-in-progress
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request with this Idempotency-Key is still in progress
          headers:
            Retry-After:
              description: Seconds to wait before sending the same request again.
              schema:
                type: integer
                format: int32
                example: 1
        "422":
          content:
            application/problem+json:
              examples:
                balance-limit-exceeded:
                  description: The amount would take a balance past the largest value
                    the ledger can hold. No money moved.
                  summary: Balance limit exceeded
                  value:
                    status: 422
                    title: Balance limit exceeded
                    type: /problems/balance-limit-exceeded
                currency-mismatch:
                  description: The currency of the request is not the currency of
                    a wallet it names.
                  summary: Currency does not match the wallet
                  value:
                    status: 422
