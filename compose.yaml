# Infrastructure for local development.
#   docker compose up -d                            → PostgreSQL (:5433) + Kafka (:9092)
#   docker compose --profile observability up -d    → the above + Grafana (:3000) with metrics and traces
name: ledgerly

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ledgerly
      POSTGRES_DB: ledger
    ports:
      - "5433:5432"   # 5433 avoids clashing with a PostgreSQL installed on the host
    volumes:
      - postgres-data:/var/lib/postgresql   # since PostgreSQL 18 the volume mounts here, not at .../data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: PKv08dh2RNyBTaYw_tQkfg   # base64 UUID, generated with kafka-storage.sh random-uuid
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT: for containers on the compose network; PLAINTEXT_HOST: for apps running on the host
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # OpenTelemetry collector, Prometheus, Tempo, Loki and Grafana in one container. For development only.
  # The applications send to it when they run with SPRING_PROFILES_ACTIVE=observability.
  lgtm:
    image: grafana/otel-lgtm:0.35.0
    profiles: [observability]
    ports:
      - "3000:3000"   # Grafana, user admin, password admin
      - "4318:4318"   # OTLP over HTTP
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/ledgerly.json
    volumes:
      - ./infra/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/custom:ro
      - ./infra/grafana/dashboards-provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro

volumes:
  postgres-data:
